<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E31D1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec6c6a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- 装饰圆 -->
  <circle cx="350" cy="50" r="120" fill="white" opacity="0.08"/>
  <circle cx="50" cy="350" r="80" fill="white" opacity="0.06"/>
  <!-- 图标 -->
  <g filter="url(#shadow)" opacity="0.9">
    <rect x="80" y="80" width="240" height="160" rx="12" fill="none" stroke="white" stroke-width="6"/><rect x="100" y="100" width="200" height="120" rx="4" fill="white" opacity="0.4"/><rect x="60" y="240" width="280" height="14" rx="7" fill="white" opacity="0.6"/><rect x="120" y="258" width="160" height="6" rx="3" fill="white" opacity="0.4"/>
  </g>
  <!-- 商品名 -->
  <text x="200" y="360" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="600" fill="white" opacity="0.9">联想ThinkPad X1</text>
  <!-- 标签 -->
  <text x="200" y="382" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="white" opacity="0.55">商务笔记本</text>
</svg>