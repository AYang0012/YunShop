<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A6B7A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a9ea8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- 装饰圆 -->
  <circle cx="350" cy="50" r="120" fill="white" opacity="0.08"/>
  <circle cx="50" cy="350" r="80" fill="white" opacity="0.06"/>
  <!-- 图标 -->
  <g filter="url(#shadow)" opacity="0.9">
    <rect x="140" y="60" width="120" height="260" rx="18" fill="none" stroke="white" stroke-width="6"/><rect x="155" y="80" width="90" height="200" rx="2" fill="white" opacity="0.5"/><circle cx="200" cy="315" r="8" fill="white" opacity="0.7"/>
  </g>
  <!-- 商品名 -->
  <text x="200" y="360" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="600" fill="white" opacity="0.9">华为Mate 60 Pro</text>
  <!-- 标签 -->
  <text x="200" y="382" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="white" opacity="0.55">智能手机</text>
</svg>