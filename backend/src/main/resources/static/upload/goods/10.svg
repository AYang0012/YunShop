<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#333333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7a7a7a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- 装饰圆 -->
  <circle cx="350" cy="50" r="120" fill="white" opacity="0.08"/>
  <circle cx="50" cy="350" r="80" fill="white" opacity="0.06"/>
  <!-- 图标 -->
  <g filter="url(#shadow)" opacity="0.9">
    <rect x="130" y="100" width="140" height="140" rx="24" fill="none" stroke="white" stroke-width="6"/><rect x="155" y="130" width="90" height="80" rx="8" fill="white" opacity="0.4"/><rect x="175" y="80" width="50" height="28" rx="6" fill="white" opacity="0.5"/><path d="M175 80 L175 60 Q200 50 225 60 L225 80" fill="none" stroke="white" stroke-width="5" opacity="0.6"/>
  </g>
  <!-- 商品名 -->
  <text x="200" y="360" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="600" fill="white" opacity="0.9">65W氮化镓充电器</text>
  <!-- 标签 -->
  <text x="200" y="382" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="white" opacity="0.55">快充配件</text>
</svg>