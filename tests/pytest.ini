[pytest]
# 云集优选 pytest 配置
testpaths = cases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行默认参数
addopts =
    -v
    --tb=short
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir

# 自定义标记
markers =
    smoke: 冒烟测试（核心流程快速验证）
    regression: 回归测试（完整功能验证）
    front: 前台功能测试
    admin: 后台功能测试
    login_required: 需要登录态的测试
    p0: P0 级用例 — 核心功能
    p1: P1 级用例 — 重要功能
    p2: P2 级用例 — 边缘场景

# 日志
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
